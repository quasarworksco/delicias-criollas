<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Administración · Delicias Criollas</title>
<link rel="icon" href="../assets/logo-marca.webp">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="panel.css"></head>
<body>
<header><div class="mast"><img src="../assets/logo-marca.webp" alt="Delicias Criollas"><h1>Administración</h1><a href="../">Ver la carta</a></div></header>
<nav aria-label="Secciones"><div><a href="#pedidos">Pedidos</a><a href="#catalogo">Productos</a><a href="#editor">Editor de producto</a></div></nav>
<main><p role="status" id="message"></p>
<section id="pedidos"><h2>Pedidos recientes</h2><div id="orders"></div></section>
<div class="workspace">
<section id="catalogo"><div class="section-head"><h2>Productos</h2><button id="seed" title="Cargar los productos iniciales que falten">Cargar catálogo inicial</button></div><div id="products"></div></section>
<form id="editor"><div class="editor-head"><h2 id="editing">Nuevo producto</h2></div>
<div class="fields">
<label class="wide">Nombre del producto<input name="nombre" required></label>
<label>Categoría<input name="categoria" required></label>
<label>Precio en USD<input name="precio" type="number" min="0" step=".01" required></label>
<label class="wide">Descripción<textarea name="descripcion" rows="2"></textarea></label>
<label>Promoción<input name="promocion"></label>
<label>Posición en la carta<input name="orden" type="number" min="0" step="1"></label>
<label class="wide">Foto en Cloudinary<input name="fotoPublicId" placeholder="ID público de la imagen"></label>
</div><div class="actions"><button>Guardar producto</button><button type="reset">Limpiar</button></div></form>
</div></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getFirestore,collection,doc,setDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,runTransaction} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyCcE1vtt4laxA_CRNKqFxu4RDr36cYeiRE',authDomain:'delicias-9c0b0.firebaseapp.com',projectId:'delicias-9c0b0',appId:'1:533374986764:web:9a29287e6b49b21d8c5c29'});
const db=getFirestore(app);
const $=id=>document.getElementById(id);
const form=$('editor');
let editId=null,receipts=[];
const message=text=>{$('message').textContent=text;};
const fail=()=>message('No se pudo completar la operación. Comprueba la conexión y los permisos.');
function button(text,action){const el=document.createElement('button');el.textContent=text;el.onclick=action;return el;}
const states=['Nuevo','En preparación','Listo','Entregado','Cancelado'];
function renderOrders(){
  const active=receipts.filter(d=>d.data().expira.toMillis()>Date.now());
  $('orders').replaceChildren(...active.map(d=>{
    const row=document.createElement('article'),pre=document.createElement('pre'),label=document.createElement('label'),select=document.createElement('select');
    pre.textContent=d.data().recibo;label.textContent='Estado del pedido';
    states.forEach(s=>select.add(new Option(s,s,false,s===d.data().estado)));
    select.onchange=async()=>{try{await updateDoc(d.ref,{estado:select.value});}catch{fail();renderOrders();}};
    label.append(select);row.append(pre,label);return row;
  }));
  if(!active.length) $('orders').textContent='Sin pedidos en las últimas 48 horas.';
}
setInterval(renderOrders,60000);
form.onreset=()=>{editId=null;$('editing').textContent='Nuevo producto';};
onSnapshot(query(collection(db,'pedidosPanel'),orderBy('creado','desc')),snap=>{receipts=snap.docs;renderOrders();},fail);
  onSnapshot(collection(db,'menuPublico'),snap=>{
    $('products').replaceChildren(...snap.docs.map(d=>{
      const row=document.createElement('article'),p=d.data(),name=document.createElement('strong');
      name.textContent=p.nombre+' · $'+(p.precioCentavos/100).toFixed(2)+' ';
      const image=document.createElement('img');
      image.alt='';image.loading='lazy';
      image.src=p.fotoPublicId ? 'https://res.cloudinary.com/do4fpfwlb/image/upload/f_auto,q_auto,c_fill,w_128,h_128/'+String(p.fotoPublicId).split('/').map(encodeURIComponent).join('/') :
        /^plato-(0[1-9]|1[0-6])$/.test(d.id) ? '../assets/platos/'+d.id+'.webp' : '../assets/logo-marca.webp';
      image.onerror=()=>{image.onerror=null;image.src='../assets/logo-marca.webp';};
      row.append(image,name,button('Editar',()=>{editId=d.id;$('editing').textContent='Editar producto';
        for(const field of ['nombre','categoria','descripcion','promocion','orden','fotoPublicId'])form.elements[field].value=p[field]??'';
        form.precio.value=(p.precioCentavos/100).toFixed(2);form.nombre.focus();}),
        button('Quitar',async()=>{if(confirm('¿Quitar '+p.nombre+' de la carta?'))try{await deleteDoc(d.ref);if(editId===d.id)form.reset();}catch{fail();}}));return row;
    }));
  },fail);
form.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));data.precioCentavos=Math.round(Number(data.precio)*100);delete data.precio;data.orden=Number(data.orden||999);
  try{const ref=editId?doc(db,'menuPublico',editId):doc(collection(db,'menuPublico'));await setDoc(ref,data,{merge:true});form.reset();message('Producto guardado.');}catch{fail();}};
$('seed').onclick=async()=>{try{const res=await fetch('../data/menu-inicial.json');if(!res.ok)throw Error();const entries=await res.json();
  await runTransaction(db,async tx=>{const refs=entries.map(p=>doc(db,'menuPublico',p.id));const docs=await Promise.all(refs.map(ref=>tx.get(ref)));
    entries.forEach(({id,...data},i)=>{if(!docs[i].exists())tx.set(refs[i],data);});});message('Catálogo inicial cargado.');}catch{fail();}};
</script></body></html>
